name: Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '15 2 * * *'

permissions:
  contents: read

concurrency:
  group: windows-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Check application build
        run: pyinstaller WorkBOXig.spec --noconfirm
      - name: Check installer build
        run: pyinstaller installer.spec --noconfirm
      - name: Upload manual build for review
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: WorkBOXig-Windows-review
          path: |
            dist/WorkBOXig.exe
            dist/WorkBOXig_Setup.exe
          if-no-files-found: error
          retention-days: 2
